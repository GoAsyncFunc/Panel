services:
  panel:
    build: .
    image: ghcr.io/goasyncfunc/lnrp:latest
    container_name: panel
    restart: unless-stopped
    ports:
      - "80:80"
    # 高并发需要更大的文件描述符上限（镜像内的 nginx / php-fpm 已按 65536 配置）
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 限制日志体积，避免 docker 日志写满磁盘
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./panel:/usr/local/share/html
      - ./nginx-conf.d:/etc/nginx/conf.d
      - ./cron.d:/etc/cron.d
      # - ./supervisor-conf.d:/etc/supervisor/conf.d   # 队列 worker 等额外进程，见 supervisor/queue-worker.conf.example
      # - ./redis-data:/var/lib/redis                  # Redis AOF 持久化
    depends_on:
      db:
        condition: service_healthy
    # HEALTHCHECK is defined in the image (http://localhost:8999/ping)

  # 数据库：MariaDB 比 MySQL 8 更省资源（默认不启用 performance_schema、镜像更小）。
  # 这组按面板与数据库同机部署预算：缓冲池约占内存一半，其余留给 FPM、Redis 与系统（见 README 内存预算）。
  # 16G 以上的库机与小站档见文件末尾注释。
  db:
    image: mariadb:11.4
    container_name: panel-db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=6G          # 同机部署约为内存的 50%；专用库机可给 60-70%
      - --innodb-log-file-size=1G
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-neighbors=0
      - --innodb-io-capacity=2000             # NVMe；SATA SSD 用 400-1000
      - --max-connections=300
      - --table-open-cache=4000
      - --thread-cache-size=200
      - --max-allowed-packet=64M
      - --skip-name-resolve=ON
      - --slow-query-log=ON
      - --long-query-time=1
      - --binlog-expire-logs-seconds=259200   # MariaDB 默认不写 binlog；需要主从/时间点恢复时加 --log-bin（binlog 按 3 天保留）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MARIADB_ROOT_PASSWORD: change-this-root-password
      MARIADB_DATABASE: panel
      MARIADB_USER: panel
      MARIADB_PASSWORD: change-this-password
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 面板代码的 .env 里数据库地址填服务名 db，例如 DB_HOST=db、DB_USERNAME=panel
    # 需要从宿主机连库时放开：- "127.0.0.1:3306:3306"

volumes:
  db-data:

# ── 16G 以上的库机：把 --innodb-buffer-pool-size 改成 8G（32G 内存可到 16-24G）──

# ── 小站档（约 1000 用户，1-2G 内存的机器）：用这组替换上面 db 服务的 command ──
#    command:
#      - --innodb-buffer-pool-size=256M
#      - --innodb-log-file-size=128M
#      - --innodb-flush-log-at-trx-commit=2
#      - --max-connections=200
#      - --character-set-server=utf8mb4
#      - --collation-server=utf8mb4_unicode_ci
