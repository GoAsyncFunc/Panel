; php-fpm pool — single web pool running as www-data (panel defaults)
[www]
user = www-data
group = www-data

listen = /run/php/php@PHP_VERSION@-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 4
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 200

pm.status_path = /fpm_status
ping.path = /ping
ping.response = pong

catch_workers_output = yes
clear_env = no
