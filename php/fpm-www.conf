; php-fpm pool — panel defaults, sized for large deployments (see README 性能与容量)
[www]
user = www-data
group = www-data

listen = /run/php/php@PHP_VERSION@-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096

pm = dynamic
; max_children 是上限：dynamic 模式下空闲站点只跑 start_servers 个进程
; 按每个 worker 25-50MB 预算：同机部署取（内存 - 数据库 - Redis - 系统）/ 40MB，独立 web 机可提到 64
pm.max_children = 48
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 500

rlimit_files = 65536

pm.status_path = /fpm_status
ping.path = /ping
ping.response = pong

catch_workers_output = yes
clear_env = no
