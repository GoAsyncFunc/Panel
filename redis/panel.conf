# panel 内置 Redis 配置（supervisor 以 /usr/bin/redis-server /etc/redis/panel.conf 启动）
# 无密码、容器内网可达；需要跨机器访问请加 requirepass 并在面板 .env 里配 REDIS_PASSWORD。
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 4096
dir /var/lib/redis

# 队列依赖 AOF（everysec 最多丢 1 秒），关闭 RDB
save ""
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 512mb

# 上限保护：超出后只淘汰带 TTL 的缓存键，队列键不设过期时间即不会被淘汰
maxmemory 1gb
maxmemory-policy volatile-lru
